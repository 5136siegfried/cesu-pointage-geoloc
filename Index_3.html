<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; text-align: center; }
    h1 { font-size: 20px; }
    select, button { font-size: 18px; padding: 12px; margin: 10px 0; width: 100%; border-radius: 8px; box-sizing: border-box; }
    select { border: 1px solid #ccc; }
    button { color: white; border: none; cursor: pointer; }
    #arrivee { background: #2e7d32; }
    #depart { background: #c62828; }
    #statut { margin-top: 20px; font-size: 15px; min-height: 60px; }
  </style>
</head>
<body>
  <h1>Pointage — aide à domicile</h1>

  <select id="salariee">
    <? for (var i = 0; i < salariees.length; i++) { ?>
      <option value="<?= salariees[i] ?>"><?= salariees[i] ?></option>
    <? } ?>
  </select>

  <button id="arrivee" onclick="pointer('Arrivée')">✅ Pointer l'arrivée</button>
  <button id="depart" onclick="pointer('Départ')">🚪 Pointer le départ</button>

  <div id="statut"></div>

  <script>
    function pointer(type) {
      const statut = document.getElementById('statut');
      const salariee = document.getElementById('salariee').value;
      statut.innerText = 'Localisation en cours...';

      if (!navigator.geolocation) {
        envoyer(type, salariee, null, null, null);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => envoyer(type, salariee, pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
        () => envoyer(type, salariee, null, null, null),
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function envoyer(type, salariee, lat, lng, precision) {
      document.getElementById('statut').innerText = 'Envoi en cours...';
      google.script.run
        .withSuccessHandler(function(res) {
          document.getElementById('statut').innerText =
            type + ' enregistré pour ' + salariee + '. Statut : ' + res.statut +
            (res.distance !== null ? ' (' + res.distance + ' m du domicile)' : '');
        })
        .withFailureHandler(function(err) {
          document.getElementById('statut').innerText = 'Erreur : ' + err.message;
        })
        .enregistrerPointage(type, salariee, lat, lng, precision);
    }
  </script>
</body>
</html>
