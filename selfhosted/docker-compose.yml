services:
  cesu-pointage:
    build: .
    container_name: cesu-pointage
    restart: unless-stopped
    volumes:
      - ./data:/app/data   # fichier SQLite persistant, survit aux redéploiements
    environment:
      - TZ=Europe/Paris
    ports:
      - "127.0.0.1:8000:8000"   # lié en local uniquement : nginx fait le reverse proxy + TLS (certbot)
