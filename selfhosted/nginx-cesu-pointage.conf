# À placer dans /etc/nginx/sites-available/cesu-pointage, puis :
#   sudo ln -s /etc/nginx/sites-available/cesu-pointage /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pointage.tondomaine.fr
# (certbot réécrit ce fichier lui-même pour ajouter le bloc HTTPS + redirection — normal)

server {
    listen 80;
    server_name pointage.tondomaine.fr;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /admin protégé par Basic Auth au niveau de nginx — rien à coder dans l'app
    location /admin {
        auth_basic "Zone manager";
        auth_basic_user_file /etc/nginx/.htpasswd-cesu;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
