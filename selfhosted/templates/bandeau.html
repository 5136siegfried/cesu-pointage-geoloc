<body>

<h1>Bandeau d'alerte</h1>

<div class="carte">
  <p>Affiché en haut de la page de pointage, visible par toutes les salariées. Utile pour prévenir d'une absence, d'un changement d'horaire, d'une consigne ponctuelle...</p>
  <form method="post" action="/admin/bandeau">
    <label><input type="checkbox" name="actif" {{ "checked" if actif else "" }}> Afficher le bandeau</label>
    <label>Type
      <select name="type">
        <option value="info" {{ "selected" if type == "info" else "" }}>Info (bleu)</option>
        <option value="alerte" {{ "selected" if type == "alerte" else "" }}>Alerte (rouge)</option>
      </select>
    </label>
    <label>Message <input type="text" name="message" value="{{ message }}"></label>
    <button type="submit">💾 Enregistrer</button>
  </form>
</div>
</body>
</html>
