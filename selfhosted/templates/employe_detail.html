<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Modifier {{ e.nom }} — Pointage CESU</title>
<style>
  body { font-family: Arial, sans-serif; margin: 24px; color: #222; max-width: 500px; }
  nav { margin-bottom: 20px; font-size: 14px; }
  nav a { margin-right: 14px; color: #2e7d32; text-decoration: none; }
  label { display: block; margin-top: 12px; font-size: 14px; }
  input, textarea { font-size: 14px; padding: 6px; width: 100%; box-sizing: border-box; margin-top: 4px; }
  button { padding: 8px 16px; border: none; border-radius: 4px; color: white; cursor: pointer; margin-top: 16px; }
  .btn-save { background: #2e7d32; }
  .btn-delete { background: #c62828; }
</style>
</head>
<body>
<nav><a href="/admin/employes">← Retour à la liste</a></nav>

<h1>Modifier — {{ e.nom }}</h1>

<form method="post" action="/admin/employes/{{ e.id }}/edit">
  <label>Nom <input name="nom" value="{{ e.nom }}" required></label>
  <label>Taux horaire (€) <input name="taux_horaire" type="number" step="0.01" min="0" value="{{ e.taux_horaire }}" required></label>
  <label>Notes <textarea name="notes" rows="3">{{ e.notes or '' }}</textarea></label>
  <label><input type="checkbox" name="actif" style="width:auto;display:inline" {{ "checked" if e.actif else "" }}> Actif (apparaît dans le menu de pointage)</label>
  <button type="submit" class="btn-save">💾 Enregistrer</button>
</form>

<form method="post" action="/admin/employes/{{ e.id }}/supprimer" onsubmit="return confirm('Supprimer définitivement cet employé ? Les pointages déjà enregistrés sous ce nom ne seront pas supprimés.');">
  <button type="submit" class="btn-delete">🗑 Supprimer l'employé</button>
</form>
</body>
</html>
