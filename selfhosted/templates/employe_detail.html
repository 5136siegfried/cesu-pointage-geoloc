<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modifier {{ e.nom }} — Pointage CESU</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<a href="/admin/employes" class="retour">← Retour à la liste</a>

<h1>Modifier — {{ e.nom }}</h1>

<div class="carte">
  <form method="post" action="/admin/employes/{{ e.id }}/edit">
    <h2 style="margin-top:0;">Identité</h2>
    <label>Nom <input name="nom" value="{{ e.nom }}" required></label>
    <div class="grille">
      <label>Téléphone <input name="telephone" value="{{ e.telephone or '' }}"></label>
      <label>Date de naissance <input name="date_naissance" type="date" value="{{ e.date_naissance or '' }}"></label>
    </div>
    <label>Numéro de sécurité sociale <input name="numero_secu" value="{{ e.numero_secu or '' }}"></label>
    <label>Adresse <input name="adresse" value="{{ e.adresse or '' }}"></label>

    <h2>Rémunération</h2>
    <label>Taux horaire (€) <input name="taux_horaire" type="number" step="0.01" min="0" value="{{ e.taux_horaire }}" required></label>

    <h2>Autres</h2>
    <label>Notes <textarea name="notes" rows="3">{{ e.notes or '' }}</textarea></label>
    <label><input type="checkbox" name="actif" {{ "checked" if e.actif else "" }}> Actif (apparaît dans le menu de pointage)</label>

    <button type="submit">💾 Enregistrer</button>
  </form>
</div>

<div class="carte">
  <form method="post" action="/admin/employes/{{ e.id }}/supprimer" onsubmit="return confirm('Supprimer définitivement cet employé ? Les pointages déjà enregistrés sous ce nom ne seront pas supprimés.');">
    <button type="submit" class="btn-delete">🗑 Supprimer l'employé</button>
  </form>
</div>
</body>
</html>
