<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employés — Pointage CESU</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<nav class="admin-nav">
  <a href="/admin">📊 Tableau de bord</a>
  <a href="/admin/employes" class="actif">👥 Employés</a>
  <a href="/admin/clients">🏠 Clients</a>
  <a href="/admin/planning">🗓 Planning</a>
  <a href="/admin/bandeau">📢 Bandeau d'alerte</a>
</nav>

<h1>Employés</h1>

<div class="carte">
  <h2 style="margin-top:0;">Ajouter un employé</h2>
  <form method="post" action="/admin/employes">
    <div class="grille">
      <label>Nom <input name="nom" required></label>
      <label>Taux horaire (€) <input name="taux_horaire" type="number" step="0.01" min="0" required></label>
    </div>
    <div class="grille">
      <label>Téléphone <input name="telephone"></label>
      <label>Date de naissance <input name="date_naissance" type="date"></label>
    </div>
    <label>Numéro de sécurité sociale <input name="numero_secu"></label>
    <label>Adresse <input name="adresse"></label>
    <label>Notes <input name="notes"></label>
    <button type="submit">Ajouter</button>
  </form>
</div>

<div class="carte">
  <h2 style="margin-top:0;">Liste</h2>
  <div class="table-scroll">
    <table>
      <tr><th>Nom</th><th>Taux horaire</th><th>Téléphone</th><th>Actif</th><th></th></tr>
      {% for e in employes %}
      <tr>
        <td>{{ e.nom }}</td>
        <td>{{ e.taux_horaire }} €/h</td>
        <td>{{ e.telephone or "" }}</td>
        <td>{{ "Oui" if e.actif else "Non" }}</td>
        <td><a href="/admin/employes/{{ e.id }}">Modifier</a></td>
      </tr>
      {% endfor %}
    </table>
  </div>
</div>
</body>
</html>
