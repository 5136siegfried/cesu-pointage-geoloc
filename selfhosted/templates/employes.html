<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Employés — Pointage CESU</title>
<style>
  body { font-family: Arial, sans-serif; margin: 24px; color: #222; max-width: 700px; }
  nav { margin-bottom: 20px; font-size: 14px; }
  nav a { margin-right: 14px; color: #2e7d32; text-decoration: none; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 8px; }
  th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
  th { background: #f4f4f4; }
  input, textarea { font-size: 14px; padding: 6px; margin: 4px 0; width: 100%; box-sizing: border-box; }
  button { padding: 6px 14px; border: none; border-radius: 4px; background: #2e7d32; color: white; cursor: pointer; margin-top: 8px; }
  form.ligne { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  form.ligne > div { flex: 1; min-width: 120px; }
</style>
</head>
<body>
<nav>
  <a href="/admin">📊 Tableau de bord</a>
  <a href="/admin/employes">👥 Employés</a>
  <a href="/admin/planning">🗓 Planning</a>
  <a href="/admin/consignes">📋 Consignes</a>
  <a href="/admin/bandeau">📢 Bandeau d'alerte</a>
</nav>

<h1>Employés</h1>

<h2>Ajouter un employé</h2>
<form class="ligne" method="post" action="/admin/employes">
  <div><label>Nom<input name="nom" required></label></div>
  <div><label>Taux horaire (€)<input name="taux_horaire" type="number" step="0.01" min="0" required></label></div>
  <div><label>Notes<input name="notes"></label></div>
  <div><button type="submit">Ajouter</button></div>
</form>

<h2>Liste</h2>
<table>
  <tr><th>Nom</th><th>Taux horaire</th><th>Actif</th><th>Notes</th><th></th></tr>
  {% for e in employes %}
  <tr>
    <td>{{ e.nom }}</td>
    <td>{{ e.taux_horaire }} €/h</td>
    <td>{{ "Oui" if e.actif else "Non" }}</td>
    <td>{{ e.notes or "" }}</td>
    <td><a href="/admin/employes/{{ e.id }}">Modifier</a></td>
  </tr>
  {% endfor %}
</table>
</body>
</html>
