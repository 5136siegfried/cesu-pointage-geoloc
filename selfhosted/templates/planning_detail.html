<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modifier un créneau — Pointage CESU</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<a href="/admin/planning" class="retour">← Retour au planning</a>

<h1>Modifier le créneau</h1>

<div class="carte">
  <form method="post" action="/admin/planning/{{ p.id }}/edit">
    <label>Salariée
      <select name="employe" required>{% for e in employes %}<option value="{{ e.nom }}" {{ "selected" if e.nom == p.employe else "" }}>{{ e.nom }}</option>{% endfor %}</select>
    </label>
    <label>Client
      <select name="client" required>{% for c in clients %}<option value="{{ c }}" {{ "selected" if c == p.client else "" }}>{{ c }}</option>{% endfor %}</select>
    </label>
    <label>Jour
      <select name="jour_semaine" required>{% for i in range(7) %}<option value="{{ i }}" {{ "selected" if i == p.jour_semaine else "" }}>{{ jours[i] }}</option>{% endfor %}</select>
    </label>
    <div class="grille">
      <label>Début <input name="heure_debut" type="time" value="{{ p.heure_debut }}" required></label>
      <label>Fin <input name="heure_fin" type="time" value="{{ p.heure_fin }}" required></label>
    </div>
    <label>Notes <input name="notes" value="{{ p.notes or '' }}"></label>
    <button type="submit">💾 Enregistrer</button>
  </form>
</div>

<div class="carte">
  <form method="post" action="/admin/planning/{{ p.id }}/supprimer" onsubmit="return confirm('Supprimer ce créneau récurrent ?');">
    <button type="submit" class="btn-delete">🗑 Supprimer</button>
  </form>
</div>
</body>
</html>
